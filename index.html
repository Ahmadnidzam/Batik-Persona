    @media (max-width: 900px) {

      .hero-grid { grid-template-columns: 1fr !important; gap: 48px !important; }

      .batik-types-grid { grid-template-columns: repeat(2, 1fr) !important; }
    }
    @media (max-width: 600px) {
      .hero-section { padding-top: 100px !important; padding-bottom: 24px !important; }
    }
    @media (max-width: 768px) {
      .nav-desktop { display: none !important; }

    }
    @media (max-width: 600px) {
      .footer-grid { grid-template-columns: 1fr !important; }
      .palette-grid { grid-template-columns: repeat(2, 1fr) !important; }
      .batik-types-grid { grid-template-columns: 1fr !important; }
    }
  </style>
